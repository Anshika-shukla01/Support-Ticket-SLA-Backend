enum UserRole {
  USER
  AGENT
  ADMIN
}

enum TicketPriority {
  LOW
  MEDIUM
  HIGH
  URGENT
}

enum TicketStatus {
  OPEN
  IN_PROGRESS
  RESOLVED
  CLOSED
}

enum SLAState {
  ON_TRACK
  AT_RISK
  BREACHED
}

type SLAInfo {
  firstResponseDueAt: String!
  resolutionDueAt: String!

  firstResponseState: SLAState!
  resolutionState: SLAState!

  firstResponseRemainingMinutes: Int!
  resolutionRemainingMinutes: Int!
}

type User {
  id: ID!
  name: String!
  email: String!
  role: UserRole!
  createdAt: String!
}

type Comment {
  id: ID!
  content: String!
  author: User!
  createdAt: String!
}

type Holiday {
  id: ID!
  date: String!
  name: String!
  createdAt: String!
}

type Ticket {
  id: ID!
  title: String!
  description: String!
  priority: TicketPriority!
  status: TicketStatus!

  creator: User!
  agent: User

   firstResponseAt: String
  firstResponseDueAt: String!

  resolvedAt: String
  resolutionDueAt: String!

  sla: SLAInfo!

  comments: [Comment!]!

  createdAt: String!
  updatedAt: String!
}

type AuthPayload {
  token: String!
  user: User!
}

input TicketFilter {
  status: TicketStatus
  priority: TicketPriority
  assigneeId: ID
  slaState: SLAState
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type TicketConnection {
  nodes: [Ticket!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type TicketDashboard {
  openTickets: Int!
  inProgressTickets: Int!
  atRiskTickets: Int!
  breachedTickets: Int!
}

type Query {
  tickets(
    filter: TicketFilter
    take: Int
    cursor: String
  ): TicketConnection!

  ticket(id: ID!): Ticket

  me: User
  agents: [User!]!
  dashboard: TicketDashboard!
  users(role: UserRole): [User!]!
  holidays: [Holiday!]!
}

type Mutation {
  register(
    name: String!
    email: String!
    password: String!
    role: UserRole!
  ): AuthPayload!

  login(
    email: String!
    password: String!
  ): AuthPayload!

  updateUserRole(
  userId: ID!
  role: UserRole!
  ): User!

  createTicket(
    title: String!
    description: String!
    priority: TicketPriority!
  ): Ticket!

  assignTicket(
    ticketId: ID!
    agentId: ID!
  ): Ticket!

  changeTicketStatus(
    ticketId: ID!
    status: TicketStatus!
  ): Ticket!

  addComment(
    ticketId: ID!
    content: String!
  ): Comment!

  resolveTicket(
  ticketId: ID!
): Ticket!


}